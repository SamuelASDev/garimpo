name: Coletar vagas

# Disparado pelo cron do servidor a cada 4h (php artisan garimpo:coletar): o agendador do GitHub atrasa e pula
# execuções. Também dá para rodar na mão em Actions → Coletar vagas → Run workflow.
on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar jobspy (só se ativado)
        if: vars.USE_JOBSPY == '1'
        run: pip install python-jobspy
      - name: Coletar e enviar
        run: python collector/collect.py
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOOBLE_HOST: ${{ vars.JOOBLE_HOST }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USE_JOBSPY: ${{ vars.USE_JOBSPY }}
